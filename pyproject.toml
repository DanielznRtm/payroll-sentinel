[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payroll-sentinel"
version = "0.2.0"
description = "Validate payroll submissions before they enter a salary benchmark: rules, peer-comparison anomaly ensemble and LLM title normalization."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "requests>=2.31", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]
ui = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
