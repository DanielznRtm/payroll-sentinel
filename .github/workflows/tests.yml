name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,ui]"

      - name: Unit and end-to-end tests
        run: pytest -q

      - name: Full pipeline run (rules only, offline, no API key)
        run: python -m payroll_sentinel.cli run --data /tmp/data --reports /tmp/reports
