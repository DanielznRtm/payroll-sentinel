[browser]
# Do not send usage statistics to Streamlit's servers.
gatherUsageStats = false

[server]
# Skip the first-run e-mail prompt in the terminal. run_ui.bat opens the browser itself.
headless = true
# server.address is not set here on purpose: the public demo on Streamlit Community
# Cloud must answer its proxy. Local runs pass --server.address localhost instead
# (run_ui.bat and the README command), so only this computer can open the app.
